# Owner-approved power cap for mode-search-engine. Originally 2026-09-26 (control-operator).
# CHANGED 2026-11-12: the owner approved mse sharing hcm's two gpu-node-a A4000s, with
# hcm's work taking priority. platform-lead raised this quota to match, and this file is
# synced to the LIVE values as of 16:53Z that day -- it was stale and re-applying the old
# version would have undone the raise.
#
# Two constraints that live OUTSIDE this file, and both are enforced on the cluster:
#   * GPU pods on gpu-node-a MUST carry priorityClassName mse-hlst-low. An admission
#     policy has required this since 16:52Z, so a worker1 GPU Job without it is rejected.
#   * The app's own GPU Jobs pin kubernetes.io/hostname gpu-node-b instead. The shared
#     worker1 cards are for hcm-first work; our uploads use the dedicated worker2 A4000.
#
# Never raise these without the owner's OK (see the escalation rule in the project brief).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mse-power-cap
  namespace: mode-search-engine
spec:
  hard:
    count/jobs.batch: '3'
    limits.cpu: '13'
    limits.memory: 44Gi
    pods: '7'
    requests.cpu: '13'
    requests.memory: 44Gi
    requests.nvidia.com/gpu: '3'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: mse-container-defaults
  namespace: mode-search-engine
spec:
  limits:
  - default:
      cpu: '1'
      memory: 2Gi
    defaultRequest:
      cpu: 250m
      memory: 512Mi
    max:
      # The solver Job requests 4 CPU / 14Gi, which sits AT the CPU ceiling and
      # 2Gi under the memory one. Max is inclusive, so it is admitted -- but
      # with no margin: a Job larger than 4 CPU needs this raised first, and
      # that is an owner decision like the quota itself.
      cpu: '4'
      memory: 16Gi
    type: Container
